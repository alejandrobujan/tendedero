[package]
name = "tendedero"
version = "1.0.0"
edition = "2024"

[dependencies]
fontdue = "0.9.4"
tiny-skia = "0.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_HiDpi", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_UI_Shell_Common", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_SystemServices"] }
windows-core = "0.62"
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
